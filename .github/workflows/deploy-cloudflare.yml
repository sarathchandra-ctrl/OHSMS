name: Deploy OHSMS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ohsms
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Until these three repository secrets exist the job skips with a notice
      # rather than failing every push to main. OHSMS_PUBLIC_ORIGIN is the
      # Worker's address: a secret, not a variable, so GitHub masks it in this
      # public repository's logs, including where wrangler prints the URL.
      - name: Check deployment credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OHSMS_PUBLIC_ORIGIN: ${{ secrets.OHSMS_PUBLIC_ORIGIN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$OHSMS_PUBLIC_ORIGIN" ]; then
            echo "::notice::Cloudflare deploy skipped: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and OHSMS_PUBLIC_ORIGIN in GitHub Settings > Secrets and variables > Actions to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        if: steps.creds.outputs.ready == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix stack --no-audit --no-fund
      - name: Lint and test
        if: steps.creds.outputs.ready == 'true'
        run: |
          npm run lint
          node scripts/case-collision.mjs
          npm test -- --maxWorkers=2
      # wrangler.jsonc builds dist/ and deploys the Worker and assets together.
      - name: Build and deploy the ohsms Worker
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OHSMS_PUBLIC_ORIGIN: ${{ secrets.OHSMS_PUBLIC_ORIGIN }}
        run: npx --no-install wrangler deploy --name ohsms --var "BUILD_COMMIT:${GITHUB_SHA}" --var "PUBLIC_ORIGIN:${OHSMS_PUBLIC_ORIGIN}"
      - name: Verify the deployed version
        if: steps.creds.outputs.ready == 'true'
        env:
          OHSMS_PUBLIC_ORIGIN: ${{ secrets.OHSMS_PUBLIC_ORIGIN }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20 "${OHSMS_PUBLIC_ORIGIN%/}/health" --output "$RUNNER_TEMP/ohsms-health.json"
          node -e "const fs = require('node:fs'); const h = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/ohsms-health.json', 'utf8')); if (!h.ok || h.database !== 'ok' || !h.files || h.version !== process.env.GITHUB_SHA) { console.error('The deployed Worker did not pass its database, storage and version checks.'); process.exit(1) }"
