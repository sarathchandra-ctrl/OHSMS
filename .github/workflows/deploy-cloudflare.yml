name: Deploy OHSMS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ohsms
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix stack --no-audit --no-fund
      - name: Lint and test
        run: |
          npm run lint
          node scripts/case-collision.mjs
          npm test -- --maxWorkers=2
      # wrangler.jsonc builds dist/ and deploys the Worker and assets together.
      - name: Build and deploy the ohsms Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --name ohsms --var "BUILD_COMMIT:${GITHUB_SHA}"
      - name: Verify the deployed version
        run: |
          APP_ORIGIN=$(node -e "const fs = require('node:fs'); const text = fs.readFileSync('wrangler.jsonc', 'utf8').split('\n').filter(line => !line.trimStart().startsWith('//')).join('\n'); process.stdout.write(JSON.parse(text).vars.PUBLIC_ORIGIN)")
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20 "$APP_ORIGIN/health" --output "$RUNNER_TEMP/ohsms-health.json"
          node -e "const fs = require('node:fs'); const h = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/ohsms-health.json', 'utf8')); if (!h.ok || h.database !== 'ok' || !h.files || h.version !== process.env.GITHUB_SHA) { console.error('The deployed Worker did not pass its database, storage and version checks.'); process.exit(1) }"
