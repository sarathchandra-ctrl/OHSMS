# Lint, unit tests (app + server, including the access-rule suite on SQLite),
# dependency advisories, and a production build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the tree (ISO 27001 LOW-28).
permissions:
  contents: read

jobs:
  # `--omit=dev` scans what actually ships and blocks at high; the whole tree
  # is reported as a warning that never blocks. scripts/audit-gate.mjs reads
  # the JSON report rather than npm's exit code.
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: App runtime dependencies (blocking)
        run: node scripts/audit-gate.mjs
      - name: Server dependencies
        run: npm ci --prefix stack
      - name: Server runtime dependencies (blocking)
        run: node scripts/audit-gate.mjs stack
      - name: Whole tree, including tooling (advisory only)
        if: always()
        run: node scripts/audit-gate.mjs root-all

  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Vitest 5 refuses Node 20.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The root suite drives the server (stack/), which has its own packages.
      - run: npm ci --prefix stack

      # macOS checks out a case-insensitive tree; Linux is the only image that
      # can see two names differing by case at once.
      - name: Lint
        run: |
          npm run lint
          node scripts/case-collision.mjs

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The Cloudflare Worker that serves the app and forwards the API.
      - name: Worker syntax
        run: node --check worker/index.js
