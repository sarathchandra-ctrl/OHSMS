# OHSMS for one organization on its own server with Docker: the app server,
# its SQLite database file, and a front door — either Caddy (HTTPS on this server, ports
# 80/443 open) or a Cloudflare Tunnel (no inbound ports; Cloudflare in front).
# COMPOSE_PROFILES in .env picks which: `caddy` or `cloudflare`.
# docs/SELF-HOSTING.md and docs/CLOUDFLARE.md are the procedures;
# .env.example lists every setting.
#
#   ./install.sh --domain ehs.example.com --image IMAGE    # writes .env, starts
#
# or by hand:
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d
#
# Only Caddy publishes ports (and only with the caddy profile). The app is
# reachable from inside this network and nowhere else.
name: weehs

services:
  app:
    image: ${WEEHS_IMAGE:?set WEEHS_IMAGE in .env}
    restart: unless-stopped
    environment:
      # One SQLite file, on the data volume below.
      DATABASE_FILE: /srv/stack/data/ohsms.sqlite
      PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DATA_KEY_MASTER: ${DATA_KEY_MASTER:?set DATA_KEY_MASTER in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # First start only: the organization and its first administrator.
      ORG_NAME: ${ORG_NAME:-Cult Fit}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BLOB_DIR: /srv/stack/data/files
      ADMIN_MUST_CHANGE: ${ADMIN_MUST_CHANGE:-true}
    volumes:
      # The database file and uploaded photos and documents. Back this up.
      - data:/srv/stack/data
    expose:
      - '8080'

  # Gets and renews a certificate for DOMAIN automatically. The DNS record for
  # DOMAIN must point at this server, and ports 80 and 443 must be open.
  caddy:
    image: caddy:2
    profiles: ['caddy']
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Cloudflare Tunnel: an outbound-only connection from this server to
  # Cloudflare. In the Zero Trust dashboard, give the tunnel a public hostname
  # (e.g. ehs-origin.example.com) whose service is http://app:8080.
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    profiles: ['cloudflare']
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env for the cloudflare profile}

volumes:
  data:
  caddy-data:
  caddy-config:
