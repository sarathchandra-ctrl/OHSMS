# OHSMS for one organization on its own server with Docker: the app server,
# its Postgres, and a front door — either Caddy (HTTPS on this server, ports
# 80/443 open) or a Cloudflare Tunnel (no inbound ports; Cloudflare in front).
# COMPOSE_PROFILES in .env picks which: `caddy` or `cloudflare`.
# docs/SELF-HOSTING.md and docs/CLOUDFLARE.md are the procedures;
# .env.example lists every setting.
#
#   ./install.sh --domain ehs.example.com --image IMAGE    # writes .env, starts
#
# or by hand:
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d
#
# Only Caddy publishes ports (and only with the caddy profile). The database
# and the app are reachable from inside this network and nowhere else.
name: weehs

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ehs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD in .env}
      # Read by init-db.sh, once, when the data volume is first created.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-weehs-roles.sh:ro
    healthcheck:
      # Over TCP, not the socket: during first start the image runs a
      # temporary server on the socket only, while init-db.sh creates the
      # roles, and the app must not connect to that one.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d ehs']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${WEEHS_IMAGE:?set WEEHS_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ehs_app:${APP_DB_PASSWORD}@db:5432/ehs
      PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      STATE_KEY: ${STATE_KEY:?set STATE_KEY in .env}
      CONTROL_TOKEN: ${CONTROL_TOKEN:?set CONTROL_TOKEN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DATA_KEY_MASTER: ${DATA_KEY_MASTER:?set DATA_KEY_MASTER in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      OIDC_ACCEPT_UNVERIFIED_EMAIL: ${OIDC_ACCEPT_UNVERIFIED_EMAIL:-false}
      BLOB_DIR: /srv/stack/data/files
    volumes:
      # Uploaded photos and documents. Back this up with the database.
      - files:/srv/stack/data/files
    expose:
      - '8080'

  # Gets and renews a certificate for DOMAIN automatically. The DNS record for
  # DOMAIN must point at this server, and ports 80 and 443 must be open.
  caddy:
    image: caddy:2
    profiles: ['caddy']
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Cloudflare Tunnel: an outbound-only connection from this server to
  # Cloudflare. In the Zero Trust dashboard, give the tunnel a public hostname
  # (e.g. ehs-origin.example.com) whose service is http://app:8080.
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    profiles: ['cloudflare']
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env for the cloudflare profile}

volumes:
  files:
  db-data:
  caddy-data:
  caddy-config:
